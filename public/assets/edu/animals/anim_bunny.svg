<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bunnyBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <radialGradient id="bunnyEarInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcdd2"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </radialGradient>
  </defs>
  <!-- Ears -->
  <g stroke="#bdbdbd" stroke-width="2">
    <!-- Left Ear -->
    <ellipse cx="28" cy="20" rx="7" ry="17" fill="url(#bunnyBody)" transform="rotate(-10 28 20)"/>
    <ellipse cx="28" cy="20" rx="4" ry="12" fill="url(#bunnyEarInner)" stroke="none" transform="rotate(-10 28 20)"/>
    <!-- Right Ear -->
    <ellipse cx="52" cy="20" rx="7" ry="17" fill="url(#bunnyBody)" transform="rotate(10 52 20)"/>
    <ellipse cx="52" cy="20" rx="4" ry="12" fill="url(#bunnyEarInner)" stroke="none" transform="rotate(10 52 20)"/>
  </g>
  <!-- Head -->
  <ellipse cx="40" cy="48" rx="26" ry="24" fill="url(#bunnyBody)" stroke="#9e9e9e" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="30" cy="45" r="4" fill="#212121"/>
  <circle cx="29" cy="43" r="1.5" fill="#ffffff"/>
  <circle cx="50" cy="45" r="4" fill="#212121"/>
  <circle cx="49" cy="43" r="1.5" fill="#ffffff"/>
  <!-- Cheeks -->
  <circle cx="23" cy="53" r="5" fill="#ff80ab" opacity="0.5"/>
  <circle cx="57" cy="53" r="5" fill="#ff80ab" opacity="0.5"/>
  <!-- Nose & Mouth -->
  <polygon points="40,51 37,48 43,48" fill="#ec407a"/>
  <path d="M37 54 C38 57 40 57 40 55 C40 57 42 57 43 54" fill="none" stroke="#757575" stroke-width="1.8" stroke-linecap="round"/>
</svg>
