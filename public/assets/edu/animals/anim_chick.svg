<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="chickBody" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <linearGradient id="chickBeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Feet -->
  <path d="M28 66 L22 74 M28 66 L28 75 M28 66 L34 74" stroke="#f57c00" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 66 L46 74 M52 66 L52 75 M52 66 L58 74" stroke="#f57c00" stroke-width="3" stroke-linecap="round"/>
  <!-- Body & Head -->
  <circle cx="40" cy="42" r="26" fill="url(#chickBody)" stroke="#f57f17" stroke-width="2"/>
  <!-- Wings -->
  <path d="M14 42 C14 36 22 40 22 48 C22 54 14 50 14 42 Z" fill="#fbc02d" stroke="#f57f17" stroke-width="1.5"/>
  <path d="M66 42 C66 36 58 40 58 48 C58 54 66 50 66 42 Z" fill="#fbc02d" stroke="#f57f17" stroke-width="1.5"/>
  <!-- Tuft on head -->
  <path d="M38 16 Q40 8 43 14 Q45 10 47 16" fill="none" stroke="#fbc02d" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="32" cy="36" r="4" fill="#212121"/>
  <circle cx="31" cy="34" r="1.5" fill="#ffffff"/>
  <circle cx="48" cy="36" r="4" fill="#212121"/>
  <circle cx="47" cy="34" r="1.5" fill="#ffffff"/>
  <!-- Cheeks -->
  <circle cx="26" cy="43" r="4.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="54" cy="43" r="4.5" fill="#ff8a80" opacity="0.6"/>
  <!-- Beak -->
  <polygon points="40,38 34,45 46,45" fill="url(#chickBeak)" stroke="#e65100" stroke-width="1"/>
</svg>
