<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radial gradient for flower center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>
    <!-- Petal gradient soft pink -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="45%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#be185d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 5 Petals rotated around center (64, 64) -->
    <!-- Petal 1 (Top) -->
    <path d="M64,64 C52,36 44,12 56,8 C61,6 64,13 64,13 C64,13 67,6 72,8 C84,12 76,36 64,64 Z" fill="url(#petalGrad)" stroke="#db2777" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Petal 2 (Top Right) -->
    <path d="M64,64 C52,36 44,12 56,8 C61,6 64,13 64,13 C64,13 67,6 72,8 C84,12 76,36 64,64 Z" fill="url(#petalGrad)" stroke="#db2777" stroke-width="2.5" stroke-linejoin="round" transform="rotate(72, 64, 64)" />
    <!-- Petal 3 (Bottom Right) -->
    <path d="M64,64 C52,36 44,12 56,8 C61,6 64,13 64,13 C64,13 67,6 72,8 C84,12 76,36 64,64 Z" fill="url(#petalGrad)" stroke="#db2777" stroke-width="2.5" stroke-linejoin="round" transform="rotate(144, 64, 64)" />
    <!-- Petal 4 (Bottom Left) -->
    <path d="M64,64 C52,36 44,12 56,8 C61,6 64,13 64,13 C64,13 67,6 72,8 C84,12 76,36 64,64 Z" fill="url(#petalGrad)" stroke="#db2777" stroke-width="2.5" stroke-linejoin="round" transform="rotate(216, 64, 64)" />
    <!-- Petal 5 (Top Left) -->
    <path d="M64,64 C52,36 44,12 56,8 C61,6 64,13 64,13 C64,13 67,6 72,8 C84,12 76,36 64,64 Z" fill="url(#petalGrad)" stroke="#db2777" stroke-width="2.5" stroke-linejoin="round" transform="rotate(288, 64, 64)" />

    <!-- Flower Center Stamen & Disc -->
    <circle cx="64" cy="64" r="16" fill="url(#centerGlow)" stroke="#ea580c" stroke-width="2" />
    <circle cx="64" cy="64" r="8" fill="#fef9c3" opacity="0.8" />
    <!-- Stamen Dots -->
    <circle cx="64" cy="53" r="2.5" fill="#c2410c" />
    <circle cx="73" cy="58" r="2.5" fill="#c2410c" />
    <circle cx="70" cy="71" r="2.5" fill="#c2410c" />
    <circle cx="58" cy="71" r="2.5" fill="#c2410c" />
    <circle cx="55" cy="58" r="2.5" fill="#c2410c" />
    <!-- Center Sparkle -->
    <circle cx="62" cy="62" r="3" fill="#ffffff" />
  </g>
</svg>