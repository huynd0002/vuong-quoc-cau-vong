<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bearBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="50%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </radialGradient>
    <radialGradient id="bearMuzzle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </radialGradient>
    <radialGradient id="bearEarInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </radialGradient>
  </defs>
  <!-- Ears -->
  <circle cx="20" cy="24" r="12" fill="url(#bearBody)" stroke="#4e342e" stroke-width="2"/>
  <circle cx="20" cy="24" r="7" fill="url(#bearEarInner)"/>
  <circle cx="60" cy="24" r="12" fill="url(#bearBody)" stroke="#4e342e" stroke-width="2"/>
  <circle cx="60" cy="24" r="7" fill="url(#bearEarInner)"/>
  <!-- Head -->
  <circle cx="40" cy="46" r="28" fill="url(#bearBody)" stroke="#4e342e" stroke-width="2.2"/>
  <!-- Eyes -->
  <circle cx="29" cy="40" r="4" fill="#212121"/>
  <circle cx="28" cy="38" r="1.5" fill="#ffffff"/>
  <circle cx="51" cy="40" r="4" fill="#212121"/>
  <circle cx="50" cy="38" r="1.5" fill="#ffffff"/>
  <!-- Cheeks -->
  <circle cx="21" cy="48" r="4.5" fill="#ffab91" opacity="0.6"/>
  <circle cx="59" cy="48" r="4.5" fill="#ffab91" opacity="0.6"/>
  <!-- Muzzle -->
  <ellipse cx="40" cy="53" rx="14" ry="11" fill="url(#bearMuzzle)" stroke="#d7ccc8" stroke-width="1"/>
  <!-- Nose -->
  <ellipse cx="40" cy="48" rx="6" ry="4" fill="#3e2723"/>
  <circle cx="39" cy="47" r="1" fill="#ffffff"/>
  <!-- Mouth -->
  <path d="M40 52 L40 56 M36 56 Q40 60 44 56" fill="none" stroke="#4e342e" stroke-width="2" stroke-linecap="round"/>
</svg>
